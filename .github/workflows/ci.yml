name: CI

on: [push, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          # Full debug + rust-lld SIGBUS on GitHub Ubuntu when many test
          # binaries link at once. GNU ld comes from `.cargo/config.toml`;
          # smaller DWARF stays in RAM.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_BUILD_JOBS: "2"
      # Skip on Ubuntu: clippy already typechecks, and `cargo build --all-targets`
      # linking every integration test at once OOMs the 7GB runner.
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --all-targets
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || 'cc' }}
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_BUILD_JOBS: "2"
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || 'cc' }}
        # Includes the GC stress suite: tests/gc_stress.rs,
        # tests/memory_gc.rs, tests/runtime_gc.rs. C fixtures compile with
        # ASan+UBSan on Unix.
      # Full 100-unit TestBatch corpus (native AOT). `cargo test` only runs an
      # allowlist in tests/result_plan_native.rs. Windows currently SKIPs
      # simtst96 (inspect+process none-deref); every other unit runs.
      - name: TestBatch
        if: runner.os == 'Linux'
        run: python3 tests/run_testbatch.py native --jobs 2
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_BUILD_JOBS: "2"
      - name: TestBatch
        if: runner.os == 'macOS'
        run: python3 tests/run_testbatch.py native --jobs 2
      - name: TestBatch
        if: runner.os == 'Windows'
        # Default pwsh (not Git bash): bash mangles MSVC `LIB` so link.exe fails.
        run: python tests/run_testbatch.py native --jobs 2
        env:
          CC: cl
      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Branch-protection / overall-success gate: the matrix is green only when
  # every OS passed. fail-fast is off so Linux, macOS, and Windows all run.
  all-platforms:
    name: linux, macos, windows
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS in the test matrix
        run: test "${{ needs.test.result }}" = "success"

  runtime-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang
          clang-tidy --config-file=runtime/.clang-tidy runtime/*.c -- -Iruntime
      - name: clang --analyze
        run: clang --analyze -I runtime runtime/*.c
      - name: Native AOT under ASan/UBSan
        env:
          SIM_RT_SANITIZE: "1"
        run: cargo test --test runtime_gc --test runtime_coro --test memory_gc --test gc_stress

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Interpreter wasm32 lib
        run: cargo build -p outimage --target wasm32-unknown-unknown --no-default-features
      - name: Browser interpreter wasm
        run: cargo browser-interp
      - name: Playground site
        working-directory: website
        run: |
          npm ci
          npm run build

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Compile and test VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run lint
      - name: E2E smoke
        working-directory: editors/vscode
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run test:e2e
      - name: Package VSIX
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: editors/vscode
        run: npm run package
      - name: Upload VSIX
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: vscode-simula-vsix
          path: editors/vscode/*.vsix

  # Unit/compile smoke only — no xvfb e2e.
  vscode-extension-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Compile and test VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run lint
