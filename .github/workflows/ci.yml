name: CI

on: [push, workflow_dispatch]

# Pages deploy needs write; other jobs only read the repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        env:
          # Full debug + rust-lld SIGBUS on GitHub Ubuntu when many test
          # binaries link at once. GNU ld comes from `.cargo/config.toml`;
          # smaller DWARF stays in RAM.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_BUILD_JOBS: "2"
      # Skip on Ubuntu: clippy already typechecks, and `cargo build --all-targets`
      # linking every integration test at once OOMs the 7GB runner.
      - name: Build
        if: runner.os != 'Linux'
        run: cargo build --all-targets
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || 'cc' }}
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_BUILD_JOBS: "2"
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || 'cc' }}
        # Includes the GC stress suite: tests/gc_stress.rs,
        # tests/memory_gc.rs, tests/runtime_gc.rs. C fixtures compile with
        # ASan+UBSan on Unix.
      # Full 100-unit TestBatch corpus (native AOT). `cargo test` only runs an
      # allowlist in tests/result_plan_native.rs.
      - name: TestBatch
        if: runner.os == 'Linux'
        run: python3 tests/run_testbatch.py native --jobs 2
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_BUILD_JOBS: "2"
      - name: TestBatch
        if: runner.os == 'macOS'
        run: python3 tests/run_testbatch.py native --jobs 2
      - name: TestBatch
        if: runner.os == 'Windows'
        # Default pwsh (not Git bash): bash mangles MSVC `LIB` so link.exe fails.
        run: python tests/run_testbatch.py native --jobs 2
        env:
          CC: cl
      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  runtime-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang
          clang-tidy --config-file=runtime/.clang-tidy runtime/*.c -- -Iruntime
      - name: clang --analyze
        run: clang --analyze -I runtime runtime/*.c
      - name: Native AOT under ASan/UBSan
        env:
          SIM_RT_SANITIZE: "1"
        run: cargo test --test runtime_gc --test runtime_coro --test memory_gc --test gc_stress

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Interpreter wasm32 lib
        run: cargo build -p outimage --target wasm32-unknown-unknown --no-default-features
      - name: Browser interpreter wasm
        run: cargo browser-interp
      - name: Playground site
        working-directory: website
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          include-hidden-files: true

  # Publish the playground only after every OS in the test matrix is green.
  deploy-pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, playground]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Release binaries for the rolling `next` draft. Debug `test` builds are not ship artifacts.
  package:
    name: Package ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    needs: [test, playground, runtime-sanitize]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Release build
        if: runner.os == 'Linux'
        run: cargo build --release
        env:
          CARGO_BUILD_JOBS: "2"
      - name: Release build
        if: runner.os != 'Linux'
        run: cargo build --release
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || 'cc' }}
      - name: Stage binary
        shell: bash
        run: bash scripts/package_sim.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-sim-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  package-vsix:
    if: github.ref == 'refs/heads/main'
    needs: [test, playground, runtime-sanitize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv vscode-simula-*.vsix "$GITHUB_WORKSPACE/dist/vscode-simula.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: release-vscode-simula
          path: dist/vscode-simula.vsix
          if-no-files-found: error

  # One draft, tag `next`. Later green main runs replace its assets until a versioned release is cut.
  draft-release:
    name: Update next draft
    if: github.ref == 'refs/heads/main'
    needs: [package, package-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: draft-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create or update next draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py --self-test
          {
            echo "Snapshot of \`main\` at \`${GITHUB_SHA:0:7}\`."
            echo
            echo "Rolling draft — not a versioned release. Cut one with **Actions → Release** (patch / minor / major)."
            echo
            prev=$(git tag --list 'v*' --sort=-version:refname | head -n1 || true)
            if [ -n "$prev" ]; then
              echo "## Commits since ${prev}"
              echo
              git log -n 80 "${prev}..${GITHUB_SHA}" --pretty=format:'- %s (%h)'
            else
              echo "## Commits"
              echo
              git log -n 80 --pretty=format:'- %s (%h)'
            fi
            echo
          } > notes.md

          if gh release view next >/dev/null 2>&1; then
            draft=$(gh release view next --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "Release 'next' exists and is published; refusing to overwrite" >&2
              exit 1
            fi
            gh release edit next --draft --title "Unreleased" --target "$GITHUB_SHA" --notes-file notes.md
          else
            gh release create next --draft --title "Unreleased" --target "$GITHUB_SHA" --notes-file notes.md
          fi
          ls -l dist
          bash scripts/sync_release_assets.sh next

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Compile and test VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run lint
      - name: E2E smoke
        working-directory: editors/vscode
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm run test:e2e
      - name: Package VSIX
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: editors/vscode
        run: npm run package
      - name: Upload VSIX
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: vscode-simula-vsix
          path: editors/vscode/*.vsix

  # Unit/compile smoke only — no xvfb e2e.
  vscode-extension-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Compile and test VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run lint
