name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (`current` tags Cargo.toml as-is)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch

permissions:
  contents: write

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Cut a release from main (got ${GITHUB_REF})" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump, commit, tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 scripts/bump_version.py --self-test
          CURRENT=$(python3 scripts/bump_version.py --print-current)

          published() {
            local state
            state=$(gh release view "$1" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
            [ "$state" = "false" ]
          }

          if published "v${CURRENT}"; then
            if [ "$BUMP" = "current" ]; then
              echo "v${CURRENT} is already published" >&2
              exit 1
            fi
            python3 scripts/bump_version.py "$BUMP"
          elif [ "$BUMP" != "current" ] && ! git rev-parse --verify --quiet "refs/tags/v${CURRENT}"; then
            python3 scripts/bump_version.py "$BUMP"
          fi

          VERSION=$(python3 scripts/bump_version.py --print-current)
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add -u
            git commit -m "Release ${TAG}"
            git push origin "HEAD:${GITHUB_REF}"
          fi

          if ! git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            git tag "$TAG"
            git push origin "refs/tags/${TAG}"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.os }}
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Release build
        if: runner.os == 'Linux'
        run: cargo build --release
        env:
          CARGO_BUILD_JOBS: "2"
      - name: Release build
        if: runner.os != 'Linux'
        run: cargo build --release
        env:
          CC: ${{ runner.os == 'Windows' && 'cl' || 'cc' }}
      - name: Stage binary
        shell: bash
        run: bash scripts/package_sim.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-sim-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  package-vsix:
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv vscode-simula-*.vsix "$GITHUB_WORKSPACE/dist/vscode-simula.vsix"
      - uses: actions/upload-artifact@v7
        with:
          name: release-vscode-simula
          path: dist/vscode-simula.vsix
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [bump, package, package-vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create release and drop next draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          prev=$(git tag --list 'v*' --sort=-version:refname | grep -vx "$TAG" | head -n1 || true)
          {
            echo "OutImage ${TAG}"
            echo
            if [ -n "$prev" ]; then
              echo "## Commits since ${prev}"
              echo
              git log -n 80 "${prev}..${SHA}" --pretty=format:'- %s (%h)'
            else
              echo "## Commits"
              echo
              git log -n 80 --pretty=format:'- %s (%h)'
            fi
            echo
          } > notes.md

          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "${TAG} is already published"
          else
            if [ "$state" = "true" ]; then
              gh release edit "$TAG" --draft=false --title "$TAG" --target "$SHA" --notes-file notes.md
            else
              gh release create "$TAG" --title "$TAG" --target "$SHA" --notes-file notes.md
            fi
            ls -l dist
            bash scripts/sync_release_assets.sh "$TAG"
          fi

          if gh release view next --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete next --yes
          fi
